; Çeviri Asistanı — PJSIP (Telnyx trunk, credential auth)
[global]
type=global
user_agent=CeviriAsistani

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__PUBLIC_IP__
external_signaling_address=__PUBLIC_IP__
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ---- Telnyx trunk ----
[telnyx]
type=registration
outbound_auth=telnyx-auth
server_uri=sip:__TRUNK_HOST__
client_uri=sip:__TRUNK_USER__@__TRUNK_HOST__
retry_interval=60
expiration=600

[telnyx-auth]
type=auth
auth_type=userpass
username=__TRUNK_USER__
password=__TRUNK_PASS__

[telnyx]
type=aor
contact=sip:__TRUNK_HOST__

[telnyx]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw
allow=alaw
outbound_auth=telnyx-auth
aors=telnyx
from_user=__TRUNK_USER__
from_domain=__TRUNK_HOST__
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=auto

[telnyx]
type=identify
endpoint=telnyx
match=__TRUNK_HOST__
match=192.76.120.0/24
match=64.16.250.0/24
match=185.246.41.0/24
