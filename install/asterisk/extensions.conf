; Çeviri Asistanı — Dialplan
[general]
static=yes
writeprotect=no

[globals]
MY_CELL=__MY_CELL__

; Trunk'tan gelen her çağrı (senin cebinden kendi numaranı aradığında)
; doğrudan Node uygulamasına (Stasis) verilir; mantık orada.
[from-trunk]
exten => _X.,1,NoOp(Gelen cagri: ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Stasis(ceviri,inbound,${CALLERID(num)})
 same => n,Hangup()

; Node'un originate ile dışarı aradığı bacak
[outbound]
exten => _X.,1,NoOp(Disari arama: ${EXTEN})
 same => n,Stasis(ceviri,outbound,${EXTEN})
 same => n,Hangup()
